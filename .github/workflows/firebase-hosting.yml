name: Deploy to Firebase Hosting on merge
on:
    branches:
      - disabled-develop # Disabled to prevent conflict with AWS
    paths:
      - 'frontend/**'
      - '.github/workflows/firebase-hosting.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: 'https://us-central1-connect-to-campus-b56ac.cloudfunctions.net/api'
          VITE_APP_URL: 'https://connect-to-campus-b56ac.web.app'

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCHOOL_SOFTWARE }}'
          channelId: live
          projectId: connect-to-campus-b56ac
          entryPoint: .
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
